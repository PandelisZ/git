[package]
name = "vex-pack-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "Pack-level derived artifact worker for Vex Git storage"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", features = ["rt-tokio"] }
aws-smithy-types = { version = "1", features = ["rt-tokio"] }
aws-types = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
mysql = "28"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
