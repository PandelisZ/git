name: vex

# This is deliberately a local-only development topology.  Every published
# listener is bound to 127.0.0.1; service-to-service traffic stays on vex_net.
services:
  mysql:
    image: mysql:8.4.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - vex_mysql_data:/var/lib/mysql
      - ../schema.sql:/docker-entrypoint-initdb.d/001-vex-schema.sql:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [vex_net]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION_NAME: ${MINIO_REGION}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - vex_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [vex_net]

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
    entrypoint: ["/bin/sh", "/usr/local/bin/create-bucket.sh"]
    volumes:
      - ./minio/create-bucket.sh:/usr/local/bin/create-bucket.sh:ro
    restart: "no"
    networks: [vex_net]

  # Until a custom Vex-aware server binary is supplied, this image runs the
  # explicitly-labelled classic-bare bootstrap in git-http/.  It proves the
  # stock-Git smart-HTTP path only; it does not make MySQL or MinIO Git SoT.
  git-http:
    build:
      context: ./git-http
      dockerfile: Dockerfile
    image: vex-git-http:dev
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      GIT_HTTP_ROOT: /srv/git
      GIT_VEX_BACKEND: ${GIT_VEX_BACKEND:-mysql+s3}
      GIT_VEX_MYSQL_DSN: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      GIT_VEX_S3_ENDPOINT: http://minio:9000
      GIT_VEX_S3_BUCKET: ${MINIO_BUCKET}
      GIT_VEX_S3_PATH_STYLE: "1"
      GIT_VEX_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      GIT_VEX_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      GIT_VEX_SCRATCH: /var/git-scratch
      GIT_VEX_REPO_GIT_GIT_UUID: ${GIT_VEX_REPO_GIT_GIT_UUID}
      VEX_GIT_HTTP_COMMAND: ${VEX_GIT_HTTP_COMMAND:-}
      VEX_REPO_INIT_COMMAND: ${VEX_REPO_INIT_COMMAND:-}
      VEX_HTTP_BASIC_USER: ${VEX_HTTP_BASIC_USER}
      VEX_HTTP_BASIC_PASSWORD: ${VEX_HTTP_BASIC_PASSWORD}
      VEX_HTTP_REQUIRE_PUSH_AUTH: ${VEX_HTTP_REQUIRE_PUSH_AUTH:-1}
      VEX_HTTP_MAX_REQUEST_BYTES: ${VEX_HTTP_MAX_REQUEST_BYTES:-67108864}
      GIT_ALLOW_HTTP: ${GIT_ALLOW_HTTP:-1}
    ports:
      - "127.0.0.1:${GIT_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GIT_HTTPS_PORT:-8443}:8443"
    volumes:
      - vex_git_bootstrap_repos:/srv/git
      - vex_git_scratch:/var/git-scratch
      # The bootstrap needs the leaf key and CA certificate, never the local
      # CA private key used by certs/gen.sh.
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      - ./certs/localhost.pem:/certs/localhost.pem:ro
      - ./certs/localhost.key:/certs/localhost.key:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /certs/rootCA.pem https://127.0.0.1:8443/healthz >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [vex_net]

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    profiles: ["cache"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks: [vex_net]

volumes:
  vex_mysql_data:
  vex_minio_data:
  # Used only by the explicitly non-Vex classic-bare bootstrap server.
  vex_git_bootstrap_repos:
  vex_git_scratch:

networks:
  vex_net:
    name: vex_net
